interface:
  display_name: "Model Switcher"
  short_description: "Route substantial work with verified quality and resource limits"
  default_prompt: "Use $model-switcher to route substantial phases to suitable models and reasoning effort. If a different qualified assignment is worthwhile, name the exact target, save and verify a handoff, and tell me the supported switch step. Report selection or resume only after matching host evidence. Preserve my choices and resource limits; keep included usage separate from API cost."
